project_id = "bitiro-lab"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5198/auth/callback", "http://127.0.0.1:5198/auth/callback?recovery=1", "http://localhost:5173/auth/callback", "http://localhost:5173/auth/callback?recovery=1", "http://127.0.0.1:5173/auth/callback", "http://127.0.0.1:5173/auth/callback?recovery=1", "https://nulljinx.com/auth/callback", "https://nulljinx.com/auth/callback?recovery=1"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
